name: Deploy site to Pages

# Site hiện được publish trực tiếp từ nhánh main (Pages legacy build), nên workflow
# này chỉ dùng khi bạn muốn chuyển sang deploy bằng Actions.
# Nếu chuyển: Settings → Pages → Source: GitHub Actions, rồi chạy tay workflow này.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
