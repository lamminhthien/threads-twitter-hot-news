name: Collect Threads hot news

on:
  schedule:
    # 01:00, 05:00, 11:00 UTC = 08:00, 12:00, 18:00 giờ Việt Nam
    - cron: "0 1,5,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Thu thập bài mới từ Threads
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_KEYWORDS: ${{ vars.THREADS_KEYWORDS }}
          MAX_PER_TOPIC: ${{ vars.MAX_PER_TOPIC || '2' }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS || '30' }}
        run: |
          if [ -z "$THREADS_TOKEN" ]; then
            echo "::notice::Chưa cấu hình secret THREADS_TOKEN, bỏ qua lần chạy này."
            exit 0
          fi
          node scripts/collect.mjs

      - name: Commit dữ liệu mới
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Không có thay đổi trong data/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): cập nhật bản tin Threads"
          git push
